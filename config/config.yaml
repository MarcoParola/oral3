defaults:
  - _datasets
  - _models
  - _self_

# -----------------------------------------------------------------
# ---                 Primary Run Configuration                 ---
# -----------------------------------------------------------------

# Select the active dataset and model for this run.
# These keys must correspond to entries in _datasets.yaml and _models.yaml.
active_dataset: PhotoMOCI    # Options: PhotoMOCI, OC_DATASET_2
active_model: resnet50      # Options: resnet50, vit_b_16

# Defines the primary objective for the script.
task: 'classification'
classification_mode: 'whole'

# -----------------------------------------------------------------
# ---                   Model Configuration                     ---
# -----------------------------------------------------------------

model:
  # The model's name and pre-trained weights are inherited from _models.yaml.
  name: ${models.classification.${active_model}.name}
  weights: ${models.classification.${active_model}.weights}

  # Dimension of the feature vector before the final classification layer.
  output_dim: 64

# -----------------------------------------------------------------
# ---                  Dataset Configuration                    ---
# -----------------------------------------------------------------

dataset:
  # Core dataset properties are inherited from _datasets.yaml.
  name: ${datasets.${active_dataset}.name}
  type: ${datasets.${active_dataset}.type}
  base_path: ${datasets.${active_dataset}.base_path}

  # Experiment-specific parameters.
  augmentation_data_path: null # D:/Tesi/FINAL_MODELS/synthetic_data/PhotoMOCI/stablediffusion_text_img/
  augmentation_percentage: 100.0

  resize: 224 # Standard image size for vision models.

# -----------------------------------------------------------------
# ---                 Training Parameters                       ---
# -----------------------------------------------------------------

train:
  save_path: "./models/${model.name}_${dataset.name}_${now:%Y-%m-%d_%H-%M-%S}"
  seed: 42
  batch_size: 64
  lr: 0.00001
  devices: 1
  max_epochs: 100
  num_workers: 5
  patience: 10
  monitor: 'val/loss'
  mode: 'min'
  save_top_k: 1
  log_every_n_steps: 1

# -----------------------------------------------------------------
# ---                  Logging Configuration                    ---
# -----------------------------------------------------------------

log:
  path: "./logs/${dataset.name}_${now:%Y-%m-%d_%H-%M-%S}}"
  wandb: True
  tensorboard: True

wandb:
  entity: f-nocella1-university-of-pisa
  project: ORAL3_class
  tag: ""
  run_name: '${model.name}_${dataset.name}'

hydra:
  run:
    dir: logs/${task}/${model.name}/${dataset.name}/${now:%Y-%m-%d_%H-%M-%S}

# -----------------------------------------------------------------
# ---              Testing-Specific Parameters                  ---
# -----------------------------------------------------------------

generate_map: "None" # Saliency map generation. Options: "None", "grad-cam".
checkpoint_base_dir: 'logs/classification/resnet50/PhotoMOCI/2025-08-22_17-01-14/'
checkpoint_file_name: null


