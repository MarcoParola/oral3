defaults:
  - _datasets
  - _models
  - _self_

# -----------------------------------------------------------------
# ---                    Run Configuration                      ---
# -----------------------------------------------------------------

# Select the active dataset and model architecture.
active_dataset: OC_DATASET_2   # Options: PhotoMOCI, OC_DATASET_2
model_type: stylegan3  # Options: lora_diffusion, stylegan3

# -----------------------------------------------------------------
# ---           LoRA Diffusion Training Parameters              ---
# -----------------------------------------------------------------

lora_params:
  train:
    seed: 42
    devices: 1
    precision: "bf16-mixed"
    max_epochs: 200
    accumulate_grad_batches: 1
    log_every_n_steps: 300
    check_val_every_n_epoch: 1
    resume_from_checkpoint: null

  checkpoint:
    monitor: 'val/loss'
    mode: "min"
    save_top_k: 3
    filename: "epoch_{epoch}_loss_{val/loss:.5f}_best"
    save_last: true
    save_weights_only: true

  model:
    # Base model is inherited from _models.yaml.
    pretrained_model_name_or_path: ${models.base.stable_diffusion_v1_5}

    # LoRA-specific hyperparameters.
    lora_rank: 16
    lora_alpha: 32
    lora_dropout: 0.15
    unet_lora_target_modules: ["to_q", "to_k", "to_v", "to_out.0"]
    train_text_encoder_lora: true
    text_encoder_lora_target_modules: ["q_proj", "v_proj"]
    learning_rate: 1.0e-04
    text_encoder_lora_lr_scale: 0.5
    use_8bit_adam: true
    adam_weight_decay: 1.0e-2
    use_4bit_quantization: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "bf16"
    gradient_checkpointing: true
    validation_metrics: ['lpips','fid']
    val_num_inference_steps: 100
    image_size: 256

  dataset:
    # Dataset paths are inherited from the _datasets.yaml library.
    base_path: ${datasets.${active_dataset}.base_path}
    train_file: ${datasets.${active_dataset}.train_file}
    val_file: ${datasets.${active_dataset}.val_file}
    test_file: ${datasets.${active_dataset}.test_file}
    image_folder: ${datasets.${active_dataset}.image_folder}

    # Training-specific data parameters.
    batch_size: 32
    num_workers: 7
    prompt_variation: False

  base_transform:
    _target_: torchvision.transforms.Compose
    transforms:
      - {_target_: torchvision.transforms.Resize, size: [256, 256], interpolation: 3} # 3 = BICUBIC
      - {_target_: torchvision.transforms.ToTensor}
      - {_target_: torchvision.transforms.Normalize, mean: [0.5, 0.5, 0.5], std: [0.5, 0.5, 0.5]}

  train_transform:
    _target_: torchvision.transforms.Compose
    transforms:
      - {_target_: torchvision.transforms.Resize, size: [500, 500], interpolation: 3} # 3 = BICUBIC
      - {_target_: torchvision.transforms.RandomHorizontalFlip, p: 0.5}
      - {_target_: torchvision.transforms.ColorJitter, brightness: 0.05, contrast: 0.05, saturation: 0.05}
      - {_target_: torchvision.transforms.RandomAffine, degrees: 10, translate: [0.15, 0.15], scale: [0.85, 1.15], shear: 5}
      - {_target_: torchvision.transforms.CenterCrop, size: [256, 256]}
      - {_target_: torchvision.transforms.ToTensor}
      - {_target_: torchvision.transforms.Normalize, mean: [0.5, 0.5, 0.5], std: [0.5, 0.5, 0.5]}

  val_transform: ${lora_params.base_transform}
  test_transform: ${lora_params.base_transform}

# -----------------------------------------------------------------
# ---              StyleGAN Training Parameters                 ---
# -----------------------------------------------------------------

stylegan3_params:
  # Data source paths are inherited from the _datasets.yaml library.
  source_data_base_path: ${datasets.${active_dataset}.base_path}
  train_data_file: ${datasets.${active_dataset}.train_file}
  validation_data_file: ${datasets.${active_dataset}.val_file}
  coco_image_source_dir: ${datasets.${active_dataset}.base_path}/${datasets.${active_dataset}.image_folder}
  prepared_data_root: './data/stylegan_prepared_datasets'
  resolution: 256

  # StyleGAN-specific hyperparameters.
  outdir: './logs/generative_models/stylegan3/${active_dataset}/${now:%Y-%m-%d_%H-%M-%S}'
  cfg: 'stylegan3-t'
  ac-gan: true
  cond: true
  aug: ada
  gpus: 1
  batch: 16
  gamma: 0.6
  glr: 2.5e-3
  dlr: 2e-3
  kimg: 200
  snap: 2
  mirror: true
  metrics: val/fid,fid
  seed: 42
  workers: 6
  class-weight: 0.2
  resume: null

# -----------------------------------------------------------------
# ---                  Global and Logging                       ---
# -----------------------------------------------------------------

stylegan3_repo_path: 'libs/stylegan3'

log:
  path: "./logs/"
  wandb: true
  level: INFO

wandb:
  project: "ORAL3_gen_models_${model_type}"
  entity: "f-nocella1-university-of-pisa"
  run_name: '${model_type}/${active_dataset}/${now:%Y-%m-%d_%H-%M-%S}'

hydra:
  run:
    dir: ${log.path}/generative_models/${model_type}/${active_dataset}/${now:%Y-%m-%d_%H-%M-%S}